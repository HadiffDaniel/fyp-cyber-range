! Force10 S50V (FTOS 8.3.2.0) - stack unit 1
! enable secret removed from this file
hostname cr-sw01
default vlan-id 999
!
interface range gigabitethernet 1/1 - 6
 no ip address
 switchport
 no shutdown
interface range gigabitethernet 1/8 - 9
 no ip address
 switchport
 no shutdown
interface range gigabitethernet 1/11 - 40
 no ip address
 switchport
 no shutdown
!
interface vlan 10
 description MGMT
 tagged gigabitethernet 1/1-4
 untagged gigabitethernet 1/8
interface vlan 20
 description DMZ
 untagged gigabitethernet 1/5
 ip address 172.16.20.1/24
interface vlan 30
 description API
 tagged gigabitethernet 1/1
 untagged gigabitethernet 1/6
interface vlan 40
 description STUDENT
 untagged gigabitethernet 1/9
 untagged gigabitethernet 1/11-40
 ip address 192.168.40.1/24
 ip helper-address 172.16.20.15
 ip access-group STUDENT-IN in
interface vlan 50
 description TUNNEL
 tagged gigabitethernet 1/1-4
interface vlan 60
 description PROVIDER
 tagged gigabitethernet 1/1
!
ip access-list extended STUDENT-IN
 permit udp any any eq 67
 permit tcp any host 172.16.20.15 eq 443
 deny ip any any
