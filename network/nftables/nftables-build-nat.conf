table ip build_nat {
  chain forward {
    type filter hook forward priority filter; policy accept;
    tcp flags syn tcp option maxseg size set rt mtu
    iifname "enx00e04c3612a5" ct state new drop
    iifname "vlan30" oifname "vlan10" drop
    iifname "vlan10" oifname "vlan30" drop
  }
  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    oifname "enx00e04c3612a5" ip saddr { 192.168.10.0/24, 192.168.30.0/24 } masquerade
  }
}
