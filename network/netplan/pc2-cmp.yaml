network:
  version: 2
  ethernets:
    enp2s0:
      dhcp4: false
  vlans:
    vlan10:
      id: 10
      link: enp2s0
      addresses: [192.168.10.12/24]
      routes:
        - to: default
          via: 192.168.10.11
      nameservers:
        addresses: [10.0.0.50, 10.0.0.27]
    vlan50:
      id: 50
      link: enp2s0
      addresses: [10.0.50.12/24]
